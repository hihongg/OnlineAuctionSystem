name: CI – Build & Test

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # MySQL service container — các DAO test cần kết nối thật tới DB.
    # Biến môi trường DB_URL / DB_USER / DB_PASS được truyền xuống
    # từ job env, khớp với getEnv() trong DatabaseConnection.java.
    # ------------------------------------------------------------------
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: auction_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:mysql://localhost:3306/auction_db?useSSL=false&serverTimezone=Asia%2FHo_Chi_Minh&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: testpass

    steps:
      # 1. Checkout source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài Java 17 (khớp với maven.compiler.source=17 trong root pom.xml)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Nạp schema & dữ liệu mẫu vào MySQL container
      #    (bao gồm INSERT admin/seller1/bidder1 mặc định mà UserDAOTest cần)
      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -u root -ptestpass < sql/auction_db.sql

      # 4. Install root POM vào local Maven repository (-N = non-recursive,
      #    chỉ install parent POM, không build các module con).
      #    Bước này bắt buộc vì server/pom.xml khai báo <parent> trỏ về
      #    com.auction:OnlineAuctionSystem:1.0-SNAPSHOT; nếu thiếu bước này
      #    Maven sẽ báo "Could not find artifact ...pom" khi resolve dependency.
      - name: Install root POM
        run: mvn -N install -DskipTests -B

      # 5. Build shared trước (server & client đều phụ thuộc vào shared)
      - name: Build shared module
        run: mvn -pl shared install -DskipTests -B

      # 6. Build + chạy toàn bộ JUnit test phía server
      #    (UserDAOTest, ItemDAOTest, BidDAOTest, UserDAOHashPasswordTest)
      - name: Build & test server
        run: mvn -pl server test -B

      # 7. Build client (chỉ compile, không test vì cần màn hình để chạy JavaFX)
      - name: Build client (compile only)
        run: mvn -pl client compile -DskipTests -B

      # 8. Tóm tắt kết quả test (hiển thị trong tab Summary của GitHub Actions)
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'server/target/surefire-reports/TEST-*.xml'
          check_name: 'JUnit Test Results'
          fail_on_failure: true