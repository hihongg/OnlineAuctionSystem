name: CI – Build & Test

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # ----------------------------------------------------------------
    # MySQL service container — các DAO test cần kết nối thật tới DB.
    # Biến môi trường DB_URL / DB_USER / DB_PASS được truyền xuống
    # từ job env, khớp với getEnv() trong DatabaseConnection.java.
    # ----------------------------------------------------------------
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: auction_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:mysql://localhost:3306/auction_db?useSSL=false&serverTimezone=Asia%2FHo_Chi_Minh&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: testpass

    steps:
      # 1. Checkout source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Khởi tạo schema auction_db từ sql/auction_db.sql
      - name: Init database schema
        run: |
          mysql -h 127.0.0.1 -u root -ptestpass auction_db < sql/auction_db.sql

      # 4. Build toàn bộ dự án (shared → server → client) + chạy JUnit tests
      - name: Build & run tests (Maven)
        run: mvn --batch-mode --no-transfer-progress verify

      # 5. Upload báo cáo test (tuỳ chọn – hữu ích để xem trực tiếp trên GitHub)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/target/surefire-reports/
          if-no-files-found: ignore